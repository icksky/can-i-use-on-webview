name: Android CI

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Change to Android directory
      run: cd getusermedia/android

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: getusermedia/android

    - name: Build with Gradle
      run: ./gradlew assembleDebug --info
      working-directory: getusermedia/android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: getusermedia/android/app/build/outputs/apk/debug/*.apk
